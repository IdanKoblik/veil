name: Tests

# One ctest suite across the compiler matrix. Called once per suite so core, cli
# and gui report as separate checks and fail independently.
on:
  workflow_call:
    inputs:
      suite:
        description: 'ctest suite to run: core, cli or gui'
        required: true
        type: string
      build-cli:
        description: 'Build the CLI. Off for the core suite, which then doubles as proof that the library stands on its own.'
        required: false
        type: boolean
        default: true
      build-gui:
        description: 'Build the GUI. Only the gui suite needs it, and it drags in X11, a GL stack and the raylib and ImGui fetch.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# A called workflow cannot see the caller's env, so this is repeated per file.
env:
  APT_PACKAGES: >-
    build-essential
    cmake
    pkg-config
    libsodium-dev
    libjpeg-dev
    libavformat-dev
    libavcodec-dev
    libavutil-dev
    libswscale-dev
    ffmpeg
  # Only the GUI needs a window system and a GL stack, so these are installed on
  # demand and the core and CLI jobs stay lean.
  APT_GUI_PACKAGES: >-
    libx11-dev
    libgl1-mesa-dev
    libxrandr-dev
    libxinerama-dev
    libxcursor-dev
    libxi-dev

jobs:
  test:
    name: ${{ inputs.suite }} (${{ matrix.os }}, ${{ matrix.cc }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        cc: [gcc, clang]
        # The GUI is C++, so the matrix has to name a C++ compiler too rather
        # than leaving CMake to pick whatever the runner defaults to.
        include:
          - cc: gcc
            cxx: g++
          - cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_PACKAGES ${{ matrix.cc }}

      - name: Install GUI dependencies
        if: inputs.build-gui
        run: sudo apt-get install -y --no-install-recommends $APT_GUI_PACKAGES

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DVEIL_WARNINGS_AS_ERRORS=ON \
            -DVEIL_BUILD_CLI=${{ inputs.build-cli && 'ON' || 'OFF' }} \
            -DVEIL_BUILD_GUI=${{ inputs.build-gui && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build -R '^${{ inputs.suite }}$' --output-on-failure

      # The suite's own e2e tests drive veil against generated images. This runs it
      # against the real assets instead, so the committed PNG and JPEG stay
      # decodable and the JPEG/DCT path gets a non-synthetic carrier.
      - name: Round trip
        if: inputs.suite == 'cli'
        run: |
          set -euo pipefail

          head -c 4096 /dev/urandom > payload.bin
          head -c 2048 /dev/urandom > small.bin

          for phrase in "correct horse battery staple" ""; do
            printf '%s\n' "$phrase" | ./build/veil encode assets/veil.png payload.bin -o carrier.png
            printf '%s\n' "$phrase" | ./build/veil decode carrier.png -o recovered.bin
            ./devtools/checksum.sh payload.bin recovered.bin

            printf '%s\n' "$phrase" | ./build/veil encode assets/veil.jpg small.bin -o carrier.jpg
            printf '%s\n' "$phrase" | ./build/veil decode carrier.jpg -o recovered-jpeg.bin
            ./devtools/checksum.sh small.bin recovered-jpeg.bin
          done
