name: Release build

on:
  workflow_call:
    inputs:
      version:
        description: 'Release version, without the leading v'
        required: true
        type: string

permissions:
  contents: read

env:
  APT_PACKAGES: >-
    build-essential
    cmake
    pkg-config
    libsodium-dev
    libjpeg-dev
    libavformat-dev
    libavcodec-dev
    libavutil-dev
    libswscale-dev
  # The X11 and GL headers raylib builds its bundled GLFW against. raylib
  # itself is fetched at configure time, so no GLFW package is installed.
  APT_GUI_PACKAGES: >-
    libx11-dev
    libgl1-mesa-dev
    libxrandr-dev
    libxinerama-dev
    libxcursor-dev
    libxi-dev

jobs:
  build:
    name: Release build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # One build per architecture rather than per Ubuntu release. The assets no
      # longer carry the runner's OS in their names, so two Ubuntu versions of
      # the same architecture would collide once the publish job merges the
      # artifacts. 22.04 is the floor for both: it links against the oldest
      # glibc the runners offer, so the binaries run in the most places.
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_PACKAGES $APT_GUI_PACKAGES

      - name: Build
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DVEIL_BUILD_TESTS=OFF \
            -DVEIL_BUILD_GUI=ON
          cmake --build build -j"$(nproc)"

      - name: Package
        id: package
        env:
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          # The architecture comes from the matrix, not from uname, so that the
          # name is decided in one place. Checking the two agree turns a
          # mislabelled runner into a failure here instead of an aarch64 build
          # published under an x86_64 name.
          if [ "$(uname -m)" != "$ARCH" ]; then
            echo "::error::Runner reports $(uname -m), the matrix expected $ARCH"
            exit 1
          fi

          # Every asset is a loose file: the release page is a one-click
          # download for whichever of the CLI, the GUI or the library to link
          # against someone wants, with nothing to unpack. The architecture
          # suffix keeps them from colliding across the matrix.
          suffix="${VERSION}-linux-${ARCH}"
          name="veil-$suffix"

          mkdir -p dist

          cp build/veil "dist/veil-$suffix"
          cp build/veil-gui "dist/veil-gui-$suffix"
          cp build/lib/libveil.a "dist/libveil-$suffix.a"

          echo "name=$name" >> "$GITHUB_OUTPUT"

          echo "### $name" >> "$GITHUB_STEP_SUMMARY"
          ls -1 dist | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/veil-*
            dist/libveil-*.a
          if-no-files-found: error
