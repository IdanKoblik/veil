name: Bug report
description: Report something in Veil that doesn't work the way it should.
title: '[Bug]: '
labels: ['type/bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please fill in as much as you can, a bug we can
        reproduce is a bug we can fix.

        For a **security vulnerability**, don't use this form. Report it
        privately via
        [Security Advisories](https://github.com/IdanKoblik/veil/security/advisories/new).

        Please don't attach an image that still carries something you'd rather
        keep hidden. Reproduce the problem with a throwaway carrier and a
        throwaway passphrase first.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched the [existing issues](https://github.com/IdanKoblik/veil/issues?q=is%3Aissue) and this hasn't been reported.
          required: true
        - label: I can reproduce this on the latest `main`.
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug, and what you expected instead.
      placeholder: |
        `decode` reports "Failed to open the header" on an image `encode` wrote
        a minute earlier, with the same passphrase typed both times.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The exact commands you ran, from a clean start.
      placeholder: |
        1. ./veil encode carrier.png payload.bin -o out.png -c lsbm
        2. ./veil decode out.png -o recovered.bin
        3. The decode fails
      render: shell
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output
      description: |
        The terminal output, ideally from a `--verbose` run. Please redact file
        names and anything else you'd rather not publish.
      render: shell
    validations:
      required: true

  - type: dropdown
    id: encryption
    attributes:
      label: Was a passphrase used?
      options:
        - 'Yes, encrypted container'
        - 'No, plain container'
        - 'Not applicable'
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag you're on, or the commit SHA if you built from source.
      placeholder: v0.1.0, or 73642c7
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Distribution and kernel
      placeholder: Ubuntu 24.04, kernel 6.8
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: A guess at the cause, a workaround you found, a diff that makes it go away.
    validations:
      required: false
